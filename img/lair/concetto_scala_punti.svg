<svg xmlns="http://www.w3.org/2000/svg" width="782" height="330" viewBox="0 0 782 330" font-family="Inter,DejaVu Sans,sans-serif">
<defs><pattern id="tMorte" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#FFFFFF" stroke-width="2" opacity=".55"/></pattern><pattern id="tAttesa" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#8C8072" opacity=".55"/></pattern></defs>
<rect x="1" y="1" width="780" height="328" fill="#FDF9F2" stroke="#D8CBB8" stroke-width="1" rx="8"/>
<text x="18" y="28" fill="#B44A1E" font-size="15" font-weight="600">L’Ascensore paga a scaglioni</text>
<text x="18" y="48" fill="#6B5D4B" font-size="12">perché il campione non salta ai primi piani — i punti vengono dai byte della ROM (stesura lunga, 0x94)</text>
<rect x="60" y="236" width="150" height="14" fill="#C9BCA8" rx="3"/>
<rect x="60" y="236" width="150" height="14" fill="url(#tAttesa)" rx="3"/>
<text x="135" y="228" fill="#241C14" font-size="15" font-weight="600" text-anchor="middle">+49</text>
<text x="135" y="268" fill="#6B5D4B" font-size="12" text-anchor="middle">piani 1–3</text>
<rect x="230" y="236" width="150" height="14" fill="#C9BCA8" rx="3"/>
<rect x="230" y="236" width="150" height="14" fill="url(#tAttesa)" rx="3"/>
<text x="305" y="228" fill="#241C14" font-size="15" font-weight="600" text-anchor="middle">+49</text>
<text x="305" y="268" fill="#6B5D4B" font-size="12" text-anchor="middle">piani 4–6</text>
<rect x="400" y="161" width="150" height="89" fill="#5FB07A" rx="3"/>
<text x="475" y="153" fill="#241C14" font-size="15" font-weight="600" text-anchor="middle">+1939</text>
<text x="475" y="268" fill="#6B5D4B" font-size="12" text-anchor="middle">piani 7–9</text>
<rect x="570" y="100" width="150" height="150" fill="#5FB07A" rx="3"/>
<text x="645" y="92" fill="#241C14" font-size="15" font-weight="600" text-anchor="middle">+3255</text>
<text x="645" y="268" fill="#6B5D4B" font-size="12" text-anchor="middle">l’uscita</text>
<line x1="40" y1="250" x2="742" y2="250" stroke="#6B5D4B" stroke-width="1" opacity=".5"/>
<text x="60" y="298" fill="#241C14" font-size="12">chi salta subito esce con <tspan font-weight="600">3304</tspan> punti · chi aspetta l’ultima terzina esce con <tspan font-weight="600">5292</tspan></text>
<text x="60" y="318" fill="#B44A1E" font-size="13" font-weight="600">la fretta costa 1988 punti</text>
<text x="60" y="338" fill="#6B5D4B" font-size="11" font-style="italic">le barre in scala, tranne piani 1–3 e piani 4–6: sarebbero troppo basse per vedersi, e hanno un’altezza minima</text>
</svg>